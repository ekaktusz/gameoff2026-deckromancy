name: Web export and itch.io deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let a running upload finish. GitHub keeps the latest pending run for each ref.
concurrency:
  group: web-export-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    name: Export Web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Godot and Web template
        id: godot-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.local/bin/deckromancy-godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/web_nothreads_release.zip
          key: godot-web-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_VERSION }}-v1
      - name: Install Godot and matching template
        if: steps.godot-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          binary="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl --fail --silent --show-error --location --retry 3 "$release/$binary.zip" -o godot.zip
          curl --fail --silent --show-error --location --retry 3 \
            "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
          sha256sum --check <<'CHECKSUMS'
          cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip
          f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  templates.tpz
          CHECKSUMS
          unzip -q godot.zip "$binary"
          install -Dm755 "$binary" "$HOME/.local/bin/deckromancy-godot"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -p templates.tpz templates/web_nothreads_release.zip > "$templates/web_nothreads_release.zip"
      - name: Import and export
        shell: bash
        run: |
          godot="$HOME/.local/bin/deckromancy-godot"
          "$godot" --version
          "$godot" --headless --editor --import 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          mkdir -p build/web
          "$godot" --headless --export-release Web build/web/index.html 2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          # Godot can print script/import errors and still exit with status 0.
          if grep -E '(^|[[:space:]])ERROR:' "$RUNNER_TEMP/godot-import.log" "$RUNNER_TEMP/godot-export.log"; then
            exit 1
          fi
          for ext in html js wasm pck; do test -s "build/web/index.$ext"; done
      - name: Save Web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deckromancy-web
          path: build/web/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish to itch.io
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download Web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deckromancy-web
          path: build/web
      - name: Install Butler
        uses: jdno/setup-butler@a28a0c10cb902786de2669a56953d101a89b48be # v2.0.0
        with:
          version: '15.32.0'
      - name: Publish current main to project 5414022
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_PROJECT_ID: '5414022'
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo 'Skipping deploy: this commit is no longer the tip of main.'
            exit 0
          fi
          if [[ -z "$BUTLER_API_KEY" ]]; then
            echo '::error::Add the BUTLER_API_KEY repository secret to enable itch.io uploads.'
            exit 1
          fi
          # Resolve the numeric project ID to the exact owner/slug Butler needs.
          if ! target=$(curl --fail --silent --show-error --max-time 30 --retry 2 \
            --header "Authorization: Bearer $BUTLER_API_KEY" https://api.itch.io/profile/games |
            jq -er --argjson id "$ITCH_PROJECT_ID" \
              '.games[] | select(.id == $id) | .url | capture("^https?://(?<owner>[a-z0-9-]+)\\.itch\\.io/(?<slug>[a-z0-9-]+)/?$") | "\(.owner)/\(.slug)"'); then
            echo "::error::The itch.io key could not resolve project $ITCH_PROJECT_ID to an itch.io project URL. Check the key and project permissions."
            exit 1
          fi
          butler push build/web "$target:html5" --userversion "${GITHUB_SHA:0:12}"
